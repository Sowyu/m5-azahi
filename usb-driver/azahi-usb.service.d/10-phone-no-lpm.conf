[Service]
# Nothing phone (initial 18d1 IDs, RNDIS tethering 05c6:9024): no USB2 hardware
# LPM. macOS never enables USB2 LPM on this port. usbcore is built in, so this
# is a runtime sysfs write, applied before the controller starts so every
# enumeration sees it. Delete this file to undo. Added 2026-09-29.
ExecStartPre=/bin/sh -c "echo 18d1:4e11:k,18d1:4ee1:k,18d1:4ee2:k,18d1:4ee3:k,18d1:4ee4:k,18d1:4ee5:k,18d1:4ee6:k,05c6:9024:k > /sys/module/usbcore/parameters/quirks"
