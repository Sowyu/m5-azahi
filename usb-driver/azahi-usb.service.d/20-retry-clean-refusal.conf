[Unit]
# At most 90 attempts in 15 minutes, then the unit stays failed.
StartLimitIntervalSec=900
StartLimitBurst=90

[Service]
ExecStart=
ExecStart=/usr/local/libexec/azahi-usb-start-retry.sh
# Restart only on the wrapper's clean-refusal code; Restart= stays "no".
RestartForceExitStatus=75
RestartSec=10
