# Install as /etc/modules-load.d/macsmc-reboot.conf on the Linux SSD root.
# The boot DT's SMC node has no "reboot" child, so the macsmc-reboot platform
# device exists without an of_node and udev never autoloads the module.
# Loading it by name binds the driver and registers the SMC power-off handler.
# See docs/shutdown-poweroff.md. Untested on hardware as of 2026-09-13.
# ponytail: userspace module load; drop this file once the boot DTB carries
# a reboot { compatible = "apple,smc-reboot"; } child under the SMC node.
macsmc_reboot
